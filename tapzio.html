<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tap Zio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070f;
    --bg-deep:#020308;
    --panel:#0b1024;
    --panel-2:#0f1530;
    --border:rgba(255,255,255,.08);
    --blue:#3a7bff;
    --blue-light:#7fb4ff;
    --blue-dim:#1a3d80;
    --blue-glow:rgba(58,123,255,.55);
    --red:#ff3b4e;
    --red-light:#ff8b93;
    --red-dim:#7a1a26;
    --red-glow:rgba(255,59,78,.5);
    --gold:#f5b324;
    --gold-light:#ffe08a;
    --purple:#8b5cf6;
    --text:#eaf1ff;
    --text-dim:#8996b8;
    --green:#33d17a;
  }
  .theme-classic{
    --blue:#2e8fd6; --blue-light:#8fd0ff; --red:#e0523e; --red-light:#ffb199; --gold:#e0a536;
  }
  .theme-midnight{
    --blue:#7c5cff; --blue-light:#c4b4ff; --red:#ff5ca8; --red-light:#ffc0dd; --gold:#5ce0d8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%; margin:0; padding:0; overflow:hidden;}
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 10%, rgba(58,123,255,.15), transparent 45%),
      radial-gradient(circle at 80% 90%, rgba(255,59,78,.15), transparent 45%),
      var(--bg-deep);
    font-family:'Rajdhani',sans-serif;
    color:var(--text);
    padding:10px;
  }
  #phone{
    position:relative;
    width:100%;
    max-width:820px;
    aspect-ratio: 820 / 780;
    background:linear-gradient(180deg,var(--panel),var(--bg));
    border-radius:40px;
    border:2px solid var(--border);
    box-shadow:0 0 0 8px #000, 0 0 80px rgba(58,123,255,.15), 0 40px 100px rgba(0,0,0,.7);
    overflow:hidden;
    isolation:isolate;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* ================= ANIMATED BACKGROUND ================= */
  #bg-canvas{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }

  /* ================= LOADING SCREEN ================= */
  #loading-screen{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg, #0a0a1a, #05050f);
    transition: opacity 0.8s ease, transform 0.8s ease;
    opacity:1;
    transform:scale(1);
  }
  #loading-screen.hide{
    opacity:0;
    transform:scale(1.08);
    pointer-events:none;
  }

  .loading-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(10px, 3vh, 20px);
    position:relative;
    z-index:2;
    padding:10px;
  }

  .cosmic-ring{
    position:relative;
    width:clamp(100px, 20vw, 160px);
    height:clamp(100px, 20vw, 160px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring-orbit{
    position:absolute;
    border-radius:50%;
    border:2px solid transparent;
    animation: orbitSpin 3s linear infinite;
  }
  .ring-orbit:nth-child(1){
    width:100%;
    height:100%;
    border-top:3px solid var(--blue-light);
    border-right:3px solid var(--purple);
    animation-duration: 2.5s;
    box-shadow:0 0 30px rgba(58,123,255,0.15);
  }
  .ring-orbit:nth-child(2){
    width:80%;
    height:80%;
    border-bottom:3px solid var(--gold);
    border-left:3px solid var(--red-light);
    animation-duration: 3.5s;
    animation-direction: reverse;
    box-shadow:0 0 30px rgba(245,179,36,0.15);
  }
  .ring-orbit:nth-child(3){
    width:60%;
    height:60%;
    border-top:3px solid var(--red);
    border-right:3px solid var(--blue-light);
    animation-duration: 4.5s;
    box-shadow:0 0 30px rgba(255,59,78,0.15);
  }
  @keyframes orbitSpin{
    0%{ transform:rotate(0deg); }
    100%{ transform:rotate(360deg); }
  }

  .energy-core{
    width:clamp(35px, 8vw, 60px);
    height:clamp(35px, 8vw, 60px);
    border-radius:50%;
    background:radial-gradient(circle at center, var(--gold-light), var(--gold), var(--purple));
    box-shadow:0 0 60px rgba(245,179,36,0.5), 0 0 120px rgba(58,123,255,0.3);
    animation: corePulse 1.5s ease-in-out infinite;
    z-index:2;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(16px, 4vw, 28px);
  }
  @keyframes corePulse{
    0%, 100%{
      transform:scale(1);
      box-shadow:0 0 60px rgba(245,179,36,0.5), 0 0 120px rgba(58,123,255,0.3);
    }
    50%{
      transform:scale(1.15);
      box-shadow:0 0 80px rgba(245,179,36,0.8), 0 0 160px rgba(58,123,255,0.5);
    }
  }

  .energy-particle{
    position:absolute;
    border-radius:50%;
    box-shadow:0 0 20px var(--gold);
    animation: floatParticle 2s ease-in-out infinite;
    opacity:0;
    width:clamp(4px, 1vw, 8px);
    height:clamp(4px, 1vw, 8px);
  }
  .energy-particle:nth-child(4){ top:-15%;left:15%; animation-delay:0s; background:var(--blue-light); box-shadow:0 0 20px var(--blue-light); }
  .energy-particle:nth-child(5){ bottom:-10%;right:15%; animation-delay:0.7s; background:var(--red-light); box-shadow:0 0 20px var(--red-light); }
  .energy-particle:nth-child(6){ top:10%;right:-15%; animation-delay:1.2s; background:var(--purple); box-shadow:0 0 20px var(--purple); }
  .energy-particle:nth-child(7){ bottom:10%;left:-15%; animation-delay:0.4s; background:var(--gold); box-shadow:0 0 20px var(--gold); }

  @keyframes floatParticle{
    0%{ opacity:0; transform:translate(0,0) scale(0.5); }
    50%{ opacity:1; transform:translate(var(--dx), var(--dy)) scale(1.2); }
    100%{ opacity:0; transform:translate(calc(var(--dx)*2), calc(var(--dy)*2)) scale(0.3); }
  }

  .loading-text-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .loading-main-text{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:clamp(24px, 5vw, 38px);
    letter-spacing:4px;
    background:linear-gradient(180deg,var(--blue-light),var(--blue) 55%, var(--red) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 60px var(--blue-glow);
    animation: textGlow 2s ease-in-out infinite;
  }
  @keyframes textGlow{
    0%, 100%{ text-shadow:0 0 30px var(--blue-glow); }
    50%{ text-shadow:0 0 60px var(--blue-glow), 0 0 80px var(--purple); }
  }
  .loading-sub-text{
    font-family:'Orbitron',sans-serif;
    font-weight:700;
    font-size:clamp(10px, 1.5vw, 13px);
    letter-spacing:6px;
    color:var(--text-dim);
    opacity:0.6;
  }

  .progress-ring-wrap{
    position:relative;
    width:clamp(100px, 22vw, 180px);
    height:clamp(100px, 22vw, 180px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .progress-ring-svg{
    transform:rotate(-90deg);
    width:100%;
    height:100%;
  }
  .progress-ring-bg{
    fill:none;
    stroke:rgba(255,255,255,0.05);
    stroke-width:4;
  }
  .progress-ring-fill{
    fill:none;
    stroke:url(#gradient);
    stroke-width:4;
    stroke-linecap:round;
    transition: stroke-dashoffset 0.3s ease;
    filter:drop-shadow(0 0 15px rgba(58,123,255,0.3));
  }
  .progress-percent{
    position:absolute;
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    font-size:clamp(18px, 3.5vw, 28px);
    color:var(--gold-light);
    text-shadow:0 0 30px rgba(245,179,36,0.2);
    letter-spacing:2px;
  }

  .screen{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    padding:clamp(15px, 3vh, 30px) clamp(15px, 3vw, 35px) clamp(18px, 3vh, 32px);
    z-index:1;
  }
  .screen.active{display:flex;}

  /* ---------- shared bits ---------- */
  .icon-btn{
    width:clamp(32px, 5vw, 44px);
    height:clamp(32px, 5vw, 44px);
    border-radius:50%;
    background:rgba(255,255,255,.06);
    border:1px solid var(--border);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; font-size:clamp(14px, 2vw, 18px);
    transition:transform .15s ease, background .15s ease;
    backdrop-filter:blur(4px);
  }
  .icon-btn:active{transform:scale(.9);}
  .icon-btn:hover{background:rgba(255,255,255,.12);}

  .btn{
    border:none; border-radius:clamp(12px, 1.5vw, 16px);
    cursor:pointer;
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    letter-spacing:.06em;
    padding:clamp(12px, 1.8vh, 18px) clamp(16px, 2.5vw, 24px);
    font-size:clamp(14px, 1.8vw, 18px);
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    color:#2b1a02;
    box-shadow:0 8px 30px rgba(245,179,36,.4), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{
    background:rgba(255,255,255,.05);
    border:1px solid var(--border);
    color:var(--text);
    backdrop-filter:blur(4px);
  }
  .btn-ghost:hover{background:rgba(255,255,255,.09);}

  /* ================= MENU ================= */
  #screen-menu{align-items:stretch;}
  .topbar{
    display:flex; 
    justify-content:space-between; 
    flex-shrink:0;
    opacity:0;
    transform:translateY(-20px);
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .topbar.visible{
    opacity:1;
    transform:translateY(0);
  }
  .logo-wrap{
    text-align:center; 
    flex-shrink:0;
    position:relative;
    padding:clamp(4px, 1vh, 10px) 0 clamp(2px, 0.5vh, 6px);
    opacity:0;
    transform:scale(0.8) translateY(-30px);
    transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index:2;
  }
  .logo-wrap.visible{
    opacity:1;
    transform:scale(1) translateY(0);
  }
  .spark{position:absolute; border-radius:50%; background:var(--blue-light); opacity:.8; filter:blur(1px); animation:twinkle 2.6s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15; transform:scale(.7);} 50%{opacity:1; transform:scale(1.2);}}
  .logo{
    font-family:'Orbitron',sans-serif; font-weight:900;
    font-size:clamp(30px, 6vw, 52px);
    line-height:1.02;
    letter-spacing:2px;
    background:linear-gradient(180deg,var(--blue-light),var(--blue) 55%, var(--red) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 60px var(--blue-glow);
  }

  .fighter-arena{
    position:relative; 
    flex-shrink:0;
    margin:clamp(4px, 1vh, 10px) 0 clamp(6px, 1.5vh, 14px);
    border-radius:clamp(14px, 2vw, 20px);
    overflow:hidden;
    background:linear-gradient(180deg, rgba(58,123,255,.10), rgba(255,59,78,.10));
    border:1px solid var(--border);
    display:flex;
    height:clamp(50px, 10vh, 90px);
    min-height:40px;
    opacity:0;
    transform:scale(0.9);
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s;
    backdrop-filter:blur(2px);
  }
  .fighter-arena.visible{
    opacity:1;
    transform:scale(1);
  }
  .fighter-half{
    flex:1; 
    position:relative; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    overflow:hidden;
    gap:clamp(4px, 1vw, 10px);
  }
  .fighter-half.blue{background:radial-gradient(circle at 50% 120%, var(--blue-dim), transparent 70%);}
  .fighter-half.red{background:radial-gradient(circle at 50% 120%, var(--red-dim), transparent 70%);}
  .fighter-icon{
    font-size:clamp(22px, 4vw, 38px);
    filter:drop-shadow(0 0 20px currentColor);
    opacity:.9;
    line-height:1;
  }
  .fighter-half.blue .fighter-icon{color:var(--blue-light);}
  .fighter-half.red .fighter-icon{color:var(--red-light);}
  .fighter-label{
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    font-size:clamp(9px, 1.3vw, 13px);
    letter-spacing:2px;
    opacity:.7;
  }
  .fighter-half.blue .fighter-label{color:var(--blue-light);}
  .fighter-half.red .fighter-label{color:var(--red-light);}
  .vs-center{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:clamp(10px, 1.5vw, 16px);
    color:var(--gold-light);
    text-shadow:0 0 30px var(--gold);
    background:rgba(0,0,0,.5);
    padding:clamp(2px, 0.3vw, 4px) clamp(8px, 1vw, 14px);
    border-radius:30px;
    border:1px solid rgba(255,215,0,.2);
    z-index:2;
  }
  .bolt{
    position:absolute; 
    inset:0; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    font-size:clamp(14px, 2vw, 24px);
    color:var(--gold-light);
    opacity:.12;
    text-shadow:0 0 30px var(--gold);
    pointer-events:none;
    z-index:1;
  }

  .btn-start-wrap{
    flex-shrink:0;
    margin:clamp(2px, 0.5vh, 6px) 0 clamp(4px, 1vh, 10px);
    opacity:0;
    transform:translateY(20px);
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s;
  }
  .btn-start-wrap.visible{
    opacity:1;
    transform:translateY(0);
  }
  .btn-start-wrap .btn-primary{
    width:100%;
    padding:clamp(12px, 2vh, 20px);
    font-size:clamp(16px, 2.2vw, 22px);
    border-radius:clamp(14px, 2vw, 20px);
  }

  .menu-secondary{
    display:flex; 
    gap:clamp(8px, 1.5vw, 14px);
    flex-shrink:0;
    opacity:0;
    transform:translateY(20px);
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s;
  }
  .menu-secondary.visible{
    opacity:1;
    transform:translateY(0);
  }
  .menu-secondary .btn{
    flex:1; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    gap:clamp(4px, 0.5vw, 8px);
    font-size:clamp(11px, 1.4vw, 15px);
    padding:clamp(10px, 1.5vh, 14px) clamp(8px, 1vw, 12px);
    border-radius:clamp(12px, 1.5vw, 16px);
  }

  /* ================= FOOTER ================= */
  .menu-footer{
    margin-top:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(2px, 0.5vh, 6px);
    padding-top:clamp(10px, 2vh, 18px);
    border-top:1px solid var(--border);
    flex-shrink:0;
    overflow:hidden;
  }
  .how-to-play{
    display:flex;
    gap:clamp(12px, 2vw, 24px);
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
  }
  .how-item{
    display:flex;
    align-items:center;
    gap:clamp(3px, 0.5vw, 6px);
    font-size:clamp(10px, 1.2vw, 13px);
    color:var(--text-dim);
    letter-spacing:.3px;
    opacity:0;
    transform:translateY(20px) scale(0.9);
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .how-item.visible{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  .how-item kbd{
    background:rgba(255,255,255,.08);
    padding:clamp(2px, 0.3vw, 4px) clamp(8px, 1vw, 14px);
    border-radius:6px;
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:clamp(11px, 1.2vw, 14px);
    border:1px solid var(--border);
    transition: all 0.3s ease;
  }
  .how-item kbd:hover {
    transform: scale(1.15);
    border-color: var(--gold);
    box-shadow: 0 0 30px rgba(245,179,36,0.2);
  }
  .how-item .blue-key{color:var(--blue-light);}
  .how-item .red-key{color:var(--red-light);}
  .how-divider{
    color:var(--border);
    font-size:clamp(12px, 1.5vw, 16px);
    opacity:.5;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform:translateY(20px);
    opacity:0;
  }
  .how-divider.visible{
    opacity:.5;
    transform:translateY(0);
  }
  .version{
    font-size:clamp(8px, 0.9vw, 11px);
    color:var(--text-dim);
    opacity:0;
    letter-spacing:2px;
    margin-top:2px;
    transform:translateY(10px);
    transition: all 0.6s ease 0.8s;
  }
  .version.visible{
    opacity:0.3;
    transform:translateY(0);
  }

  /* ================= MODALS ================= */
  .modal-overlay{
    position:absolute; inset:0; background:rgba(2,3,8,.8); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:clamp(15px, 3vw, 30px);
  }
  .modal-overlay.active{display:flex;}
  .modal{
    width:100%; max-width:500px; background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--border); border-radius:clamp(18px, 2.5vw, 24px);
    padding:clamp(18px, 3vw, 28px) clamp(20px, 3vw, 32px);
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    opacity:0;
    transform:scale(0.9);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .modal-overlay.active .modal{
    opacity:1;
    transform:scale(1);
  }
  .modal h3{
    font-family:'Orbitron',sans-serif; letter-spacing:3px; font-size:clamp(16px, 2vw, 18px);
    margin:0 0 clamp(14px, 2vh, 20px); text-align:center; color:var(--text-dim);
  }
  .field{margin-bottom:clamp(12px, 2vh, 18px);}
  .field label{display:flex; justify-content:space-between; font-weight:700; font-size:clamp(12px, 1.2vw, 14px); letter-spacing:1px; color:var(--text-dim); margin-bottom:6px;}
  input[type=range]{width:100%; accent-color:var(--blue); height:6px;}
  select{
    width:100%; background:#0d1330; color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:clamp(10px, 1.2vh, 12px) clamp(10px, 1.2vw, 14px);
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:clamp(13px, 1.3vw, 15px);
  }
  .toggle-row{display:flex; align-items:center; justify-content:space-between;}
  .switch{position:relative; width:clamp(40px, 5vw, 50px); height:clamp(22px, 3vw, 28px);}
  .switch input{opacity:0; width:0; height:0;}
  .slider-toggle{
    position:absolute; cursor:pointer; inset:0; background:#2a3252; border-radius:24px; transition:.2s;
  }
  .slider-toggle::before{
    content:""; position:absolute; width:clamp(18px, 2vw, 22px); height:clamp(18px, 2vw, 22px);
    left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;
  }
  input:checked + .slider-toggle{background:var(--green);}
  input:checked + .slider-toggle::before{transform:translateX(clamp(16px, 2.2vw, 22px));}
  .modal .btn{width:100%; margin-top:8px; padding:clamp(12px, 1.5vh, 16px); font-size:clamp(15px, 1.5vw, 17px); border-radius:clamp(12px, 1.5vw, 16px);}

  .tabs{display:flex; gap:clamp(6px, 1vw, 10px); margin-bottom:clamp(10px, 1.5vh, 16px);}
  .tab{flex:1; padding:clamp(8px, 1vh, 10px); border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,.04); color:var(--text-dim); font-weight:700; letter-spacing:1px; font-size:clamp(11px, 1.2vw, 13px); cursor:pointer;}
  .tab.active{background:linear-gradient(180deg,var(--gold-light),var(--gold)); color:#2b1a02; border-color:transparent;}
  #leaderboard-list{list-style:none; margin:0 0 16px; padding:0; display:flex; flex-direction:column; gap:clamp(6px, 1vh, 10px); max-height:clamp(200px, 30vh, 320px); overflow:auto;}
  #leaderboard-list li{
    display:flex; align-items:center; gap:clamp(8px, 1vw, 12px); padding:clamp(8px, 1.2vh, 12px) clamp(10px, 1.5vw, 16px);

  #countdown-num{

    font-size:clamp(60px, 12vw, 110px);

  .countdown-label{
    font-family:'Orbitron',sans-serif; font-weight:800; letter-spacing:6px;

  /* ================= GAME ================= */
  #screen-game{padding:clamp(12px, 1.8vh, 20px) clamp(14px, 2vw, 24px) clamp(14px, 2vh, 24px); gap:clamp(6px, 1vh, 12px);}
  .game-topbar{display:flex; align-items:center; justify-content:space-between; gap:clamp(6px, 1vw, 12px);}
  .player-badge{
    flex:1; display:flex; align-items:center; gap:clamp(4px, 0.5vw, 10px);
    padding:clamp(6px, 1vh, 10px) clamp(8px, 1vw, 16px);
    border-radius:clamp(10px, 1.5vw, 14px);
    font-family:'Orbitron',sans-serif; font-weight:700;
    font-size:clamp(11px, 1.2vw, 15px);

  }
  .player-badge.blue{background:linear-gradient(90deg, rgba(58,123,255,.22), transparent); color:var(--blue-light); justify-content:flex-start;}
  .player-badge.red{background:linear-gradient(-90deg, rgba(255,59,78,.22), transparent); color:var(--red-light); justify-content:flex-end;}
  .p-score{display:flex; align-items:center; gap:clamp(3px, 0.3vw, 6px);}
  .vs-badge{
    width:clamp(38px, 5vw, 54px);
    height:clamp(38px, 5vw, 54px);

    border:1px solid var(--border);

    font-family:'Orbitron',sans-serif; font-weight:800;
    font-size:clamp(10px, 1.2vw, 14px);
    cursor:pointer; box-shadow:0 4px 20px rgba(0,0,0,.4);
  }
  .vs-badge:active{transform:scale(.92);}
  .timer{
    align-self:center;
    font-family:'Orbitron',sans-serif; font-weight:800;
    font-size:clamp(13px, 1.5vw, 17px);
    color:var(--gold-light); letter-spacing:2px;
    background:rgba(245,179,36,.12); border:1px solid rgba(245,179,36,.35);
    padding:clamp(4px, 0.5vh, 6px) clamp(10px, 1.5vw, 18px);
    border-radius:24px;
  }
  .arena{flex:1; display:flex; flex-direction:column; border-radius:clamp(14px, 2vw, 20px); overflow:hidden; border:1px solid var(--border); position:relative; backdrop-filter:blur(2px);}
  .zone{
    flex:1; position:relative; display:flex; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden; transition:filter .1s ease;
  }
  .zone-blue{background:radial-gradient(circle at 50% 30%, rgba(58,123,255,.35), rgba(10,20,50,.9));}
  .zone-red{background:radial-gradient(circle at 50% 70%, rgba(255,59,78,.32), rgba(50,10,15,.9));}
  .zone.shake{animation:shakez .18s ease;}
  @keyframes shakez{
    0%{transform:translate(0,0);} 25%{transform:translate(-4px,3px);}
    50%{transform:translate(4px,-3px);} 75%{transform:translate(-3px,-2px);} 100%{transform:translate(0,0);}
  }
  .zone-content{text-align:center; pointer-events:none; z-index:2;}
  .team-name{
    font-family:'Orbitron',sans-serif; font-weight:800;
    font-size:clamp(18px, 3vw, 28px);
    margin:0;
    letter-spacing:2px;
  }
  .zone-blue .team-name{color:var(--blue-light); text-shadow:0 0 30px var(--blue-glow);}
  .zone-red .team-name{color:var(--red-light); text-shadow:0 0 30px var(--red-glow);}
  .tap-fast{
    margin:clamp(2px, 0.3vh, 4px) 0 0;
    font-weight:700; letter-spacing:3px;
    font-size:clamp(10px, 1.2vw, 14px);
    color:var(--text-dim);
  }
  .particle{
    position:absolute; width:clamp(6px, 1vw, 10px); height:clamp(6px, 1vw, 10px);
    border-radius:50%; pointer-events:none; z-index:5;
    animation:pop .55s ease-out forwards;
  }
  @keyframes pop{
    0%{opacity:1; transform:translate(0,0) scale(1);}
    100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.2);}
  }
  .energy-bar-wrap{
    position:absolute; top:clamp(4px, 1vh, 10px); bottom:clamp(4px, 1vh, 10px);
    left:50%; transform:translateX(-50%);
    width:clamp(28px, 4vw, 44px);
    z-index:3; display:flex; align-items:center; justify-content:center;
  }
  .energy-bar{
    position:relative; width:clamp(16px, 2.5vw, 26px);
    height:100%; border-radius:clamp(10px, 1.5vw, 16px);
    background:#0a0e1f; border:2px solid rgba(255,255,255,.25);
    overflow:hidden; box-shadow:0 0 24px rgba(0,0,0,.5);
  }
  .fill{position:absolute; left:0; right:0; transition:height .12s ease;}
  .fill-blue{top:0; background:linear-gradient(180deg,#cfe6ff,var(--blue)); box-shadow:0 0 20px var(--blue-glow) inset;}
  .fill-red{bottom:0; background:linear-gradient(0deg,#ffd3d6,var(--red)); box-shadow:0 0 20px var(--red-glow) inset;}
  .marker{
    position:absolute; left:50%; transform:translate(-50%,-50%);
    color:var(--gold-light); font-size:clamp(14px, 1.5vw, 18px);
    text-shadow:0 0 10px #000; z-index:4;
    transition:top .12s ease;
  }

  /* ================= PAUSE ================= */
  #screen-pause{align-items:center; justify-content:center; gap:clamp(12px, 2vh, 20px);}
  .pause-scoreline{display:flex; align-items:center; gap:clamp(12px, 2vw, 20px); font-family:'Orbitron',sans-serif; font-weight:700; font-size:clamp(13px, 1.5vw, 16px);}
  .pause-scoreline .blue{color:var(--blue-light);} .pause-scoreline .red{color:var(--red-light);}
  .pause-title{
    font-family:'Orbitron',sans-serif; font-weight:900;
    font-size:clamp(28px, 5vw, 42px);
    letter-spacing:4px;

  }
  #screen-pause .btn{width:clamp(180px, 25vw, 260px); text-align:center; padding:clamp(12px, 1.5vh, 16px); font-size:clamp(14px, 1.5vw, 18px); border-radius:clamp(12px, 1.5vw, 16px);}

  /* ================= WINNER ================= */
  #screen-winner{align-items:center; justify-content:center; gap:clamp(8px, 1.5vh, 12px); text-align:center;}
  .crown{font-size:clamp(50px, 8vw, 80px); filter:drop-shadow(0 0 30px var(--gold)); animation:bob 1.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .winner-title{
    font-family:'Orbitron',sans-serif; font-weight:900;
    font-size:clamp(24px, 4vw, 38px);
    margin:0; letter-spacing:2px;
  }
  .winner-title.blue{color:var(--blue-light); text-shadow:0 0 40px var(--blue-glow);}
  .winner-title.red{color:var(--red-light); text-shadow:0 0 40px var(--red-glow);}
  .medal{font-size:clamp(40px, 6vw, 64px); margin:clamp(4px, 1vh, 8px) 0; filter:drop-shadow(0 0 20px var(--gold));}
  .score-pill{
    background:rgba(255,255,255,.06); border:1px solid var(--border);
    border-radius:clamp(12px, 1.5vw, 16px);
    padding:clamp(10px, 1.5vh, 14px) clamp(18px, 3vw, 32px);
    margin:clamp(6px, 1vh, 10px) 0 clamp(14px, 2vh, 24px);

  .score-pill .label{display:block; font-size:clamp(10px, 1vw, 13px); letter-spacing:3px; color:var(--text-dim); font-weight:700;}
  .score-pill .value{font-family:'Orbitron',sans-serif; font-weight:800; font-size:clamp(20px, 3vw, 28px);}
  #screen-winner .btn{width:clamp(180px, 25vw, 260px); padding:clamp(12px, 1.5vh, 16px); font-size:clamp(14px, 1.5vw, 18px); border-radius:clamp(12px, 1.5vw, 16px);}
  .confetti{position:absolute; top:-10px; border-radius:2px; animation:fall linear forwards;}
  @keyframes fall{ to{ transform:translateY(820px) rotate(400deg); opacity:0; } }

  /* ================= RESPONSIVE BREAKPOINTS ================= */
  @media (max-width: 860px){
    #phone{
      width:100%;
      height:100vh;
      max-height:100vh;
      border-radius:0;
      border:none;
      box-shadow:none;
      aspect-ratio: auto;
    }
  }
  @media (max-height: 700px){
    .logo{font-size:clamp(20px, 5vh, 30px);}
    .fighter-arena{height:clamp(40px, 8vh, 55px);}
    .fighter-icon{font-size:clamp(18px, 3vh, 28px);}
    .team-name{font-size:clamp(14px, 2.5vh, 20px);}
    .btn-start-wrap .btn-primary{font-size:clamp(12px, 2vh, 16px); padding:clamp(8px, 1.5vh, 14px);}
    .menu-secondary .btn{font-size:clamp(10px, 1.5vh, 13px); padding:clamp(6px, 1vh, 10px);}
    .how-item{font-size:clamp(8px, 1.2vh, 11px);}
    .energy-bar-wrap{width:clamp(20px, 3vw, 30px);}
    .energy-bar{width:clamp(12px, 2vw, 18px);}
  }
  @media (max-height: 600px){
    .logo-wrap{padding:clamp(2px, 0.5vh, 6px) 0;}
    .fighter-arena{margin:clamp(2px, 0.5vh, 6px) 0;}
    .btn-start-wrap{margin:clamp(1px, 0.3vh, 4px) 0;}
    .menu-footer{padding-top:clamp(6px, 1vh, 10px);}
    .countdown-ring{width:clamp(100px, 20vw, 140px); height:clamp(100px, 20vw, 140px);}
    #countdown-num{font-size:clamp(40px, 8vw, 60px);}
  }

  /* ================= RATIO CONTROL ================= */
  .ratio-control{
    position:absolute;
    bottom:clamp(10px, 2vh, 20px);
    right:clamp(10px, 2vw, 20px);
    z-index:20;
    display:flex;
    gap:8px;
    align-items:center;
    background:rgba(0,0,0,0.7);
    padding:8px 12px;
    border-radius:30px;
    border:1px solid var(--border);
    backdrop-filter:blur(8px);
    opacity:0.6;
    transition: opacity 0.3s ease;
  }
  .ratio-control:hover{
    opacity:1;
  }
  .ratio-btn{
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:4px 10px;
    border-radius:16px;
    font-size:10px;
    cursor:pointer;
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    transition: all 0.2s ease;
    letter-spacing:0.5px;
  }
  .ratio-btn:hover{
    background:rgba(255,255,255,0.1);
    color:var(--text);
    border-color:var(--gold);
  }
  .ratio-btn.active{
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    color:#2b1a02;
    border-color:var(--gold);
  }
  .ratio-label{
    color:var(--text-dim);
    font-size:9px;
    letter-spacing:1px;
    opacity:0.5;
    margin-right:4px;
  }
  @media (max-width: 600px){
    .ratio-control{
      bottom:8px;
      right:8px;
      padding:4px 8px;
      gap:4px;
    }
    .ratio-btn{
      padding:2px 6px;
      font-size:8px;
    }
    .ratio-label{
      font-size:7px;
    }
  }
</style>
</head>
<body>
<div id="phone" class="theme-neon">

  <!-- ANIMATED BACKGROUND -->

  <!-- LOADING SCREEN -->

              <stop offset="100%" style="stop-color:#f5b324;stop-opacity:1" />

          </defs>
          <circle class="progress-ring-bg" cx="90" cy="90" r="80"></circle>

        </span>

<script>
// ================= RATIO CONTROL =================
(function(){
  const phone = document.getElementById('phone');
  const ratioBtns = document.querySelectorAll('.ratio-btn');
  
  const ratios = {
    auto: { aspect: 'auto', maxWidth: '820px' },
    mobile: { aspect: '9 / 16', maxWidth: '400px' },
    tablet: { aspect: '4 / 3', maxWidth: '700px' },
    wide: { aspect: '16 / 9', maxWidth: '960px' },
    square: { aspect: '1 / 1', maxWidth: '700px' }
  };

  function setRatio(ratioKey) {
    const ratio = ratios[ratioKey];
    if (!ratio) return;
    
    ratioBtns.forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.querySelector(`.ratio-btn[data-ratio="${ratioKey}"]`);
    if (activeBtn) activeBtn.classList.add('active');
    
    if (ratioKey === 'auto') {
      phone.style.aspectRatio = 'auto';
      phone.style.maxWidth = '100%';
      phone.style.width = '100%';
      if (window.innerWidth <= 860) {
        phone.style.height = '100vh';
        phone.style.maxHeight = '100vh';
        phone.style.borderRadius = '0';
        phone.style.border = 'none';
        phone.style.boxShadow = 'none';
      } else {
        phone.style.maxWidth = '820px';
        phone.style.width = '100%';
        phone.style.aspectRatio = '820 / 780';
        phone.style.height = 'auto';
        phone.style.maxHeight = '90vh';
        phone.style.borderRadius = '40px';
        phone.style.border = '2px solid var(--border)';
        phone.style.boxShadow = '0 0 0 8px #000, 0 0 80px rgba(58,123,255,.15), 0 40px 100px rgba(0,0,0,.7)';
      }
    } else {
      phone.style.aspectRatio = ratio.aspect;
      phone.style.maxWidth = ratio.maxWidth;
      phone.style.width = '100%';
      phone.style.height = 'auto';
      phone.style.maxHeight = '90vh';
      phone.style.borderRadius = '40px';
      phone.style.border = '2px solid var(--border)';
      phone.style.boxShadow = '0 0 0 8px #000, 0 0 80px rgba(58,123,255,.15), 0 40px 100px rgba(0,0,0,.7)';
    }
    
    setTimeout(() => {
      window.dispatchEvent(new Event('resize'));
    }, 100);
  }

  ratioBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      const ratio = this.dataset.ratio;
      setRatio(ratio);
    });
  });

  if (window.innerWidth <= 860) {
    setRatio('auto');
  }

  window.addEventListener('resize', function() {
    const activeBtn = document.querySelector('.ratio-btn.active');
    if (activeBtn && activeBtn.dataset.ratio === 'auto') {
      setRatio('auto');
    }
  });

  window.setRatio = setRatio;
})();

// ================= OPTIMIZED ANIMATED BACKGROUND =================
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let w, h;
  let particles = [];
  let orbs = [];
  let animationId = null;
  let isActive = true;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    w = canvas.width;
    h = canvas.height;
  }
  resize();

  // Reduced particle count for better performance
  class Particle {
    constructor() {
      this.x = Math.random() * w;
      this.y = Math.random() * h;
      this.size = Math.random() * 2 + 0.5;
      this.speedX = (Math.random() - 0.5) * 0.3;
      this.speedY = (Math.random() - 0.5) * 0.3;
      this.opacity = Math.random() * 0.3 + 0.1;
      this.color = ['#3a7bff', '#7fb4ff', '#8b5cf6', '#f5b324', '#ff3b4e'][Math.floor(Math.random() * 5)];
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      if (this.x < 0 || this.x > w) this.speedX *= -1;
      if (this.y < 0 || this.y > h) this.speedY *= -1;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.opacity;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  class Orb {
    constructor() {
      this.x = Math.random() * w;
      this.y = Math.random() * h;
      this.radius = Math.random() * 40 + 20;
      this.speedX = (Math.random() - 0.5) * 0.2;
      this.speedY = (Math.random() - 0.5) * 0.2;
      this.opacity = Math.random() * 0.05 + 0.02;
      this.color = ['#3a7bff', '#8b5cf6', '#f5b324', '#ff3b4e'][Math.floor(Math.random() * 4)];
      this.pulse = Math.random() * Math.PI * 2;
      this.pulseSpeed = 0.01 + Math.random() * 0.01;
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      this.pulse += this.pulseSpeed;
      if (this.x < -this.radius || this.x > w + this.radius) this.speedX *= -1;
      if (this.y < -this.radius || this.y > h + this.radius) this.speedY *= -1;
    }
    draw() {
      const radius = this.radius + Math.sin(this.pulse) * 5;
      const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, radius);
      gradient.addColorStop(0, this.color);
      gradient.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.globalAlpha = this.opacity;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function init() {
    particles = [];
    orbs = [];
    // Reduced particle count for better performance
    const count = Math.min(Math.floor((w * h) / 12000), 60);
    for (let i = 0; i < count; i++) {
      particles.push(new Particle());
    }
    for (let i = 0; i < 3; i++) {
      orbs.push(new Orb());
    }
  }
  init();

  function animate() {
    if (!isActive) return;
    ctx.clearRect(0, 0, w, h);
    orbs.forEach(orb => { orb.update(); orb.draw(); });
    particles.forEach(p => { p.update(); p.draw(); });
    animationId = requestAnimationFrame(animate);
  }
  animate();

  // Throttled resize handler
  let resizeTimeout = null;
  window.addEventListener('resize', () => {
    if (resizeTimeout) clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      resize();
      init();
      resizeTimeout = null;
    }, 200);
  });

  // Cleanup on page hide
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      isActive = false;
      if (animationId) cancelAnimationFrame(animationId);
    } else {
      isActive = true;
      animate();
    }
  });

  window._bgCleanup = function() {
    isActive = false;
    if (animationId) cancelAnimationFrame(animationId);
  };
})();

// ================= GAME LOGIC =================
(function(){
  const $ = id => document.getElementById(id);
  const phone = document.getElementById('phone');
  const loadingScreen = document.getElementById('loading-screen');
  const progressCircle = document.getElementById('progressCircle');
  const progressPercent = document.getElementById('progressPercent');
  const loadingStatus = document.getElementById('loadingStatus');

  const settings = { sound:70, music:50, vibration:true, theme:'neon', difficulty:'normal' };
  const DIFFICULTY = {
    easy:   { duration:45, step:6 },
    normal: { duration:30, step:5 },
    hard:   { duration:20, step:4 }
  };

  let actx = null;
  function ctx(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } return actx; }
  function beep(freq, dur, type){
    if(settings.sound <= 0) return;
    try{
      const c = ctx();
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.value = (settings.sound/100) * 0.15;
      osc.connect(gain); gain.connect(c.destination);
      const t0 = c.currentTime;
      gain.gain.setValueAtTime(gain.gain.value, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.start(t0); osc.stop(t0 + dur);
    }catch(e){}
  }
  function tapSound(isBlue){ beep(isBlue?620:340, 0.06, 'square'); }
  function fanfare(){
    [523,659,784,1046].forEach((f,i)=> setTimeout(()=>beep(f,0.3,'triangle'), i*120));
  }
  function vibrate(ms){
    if(settings.vibration && navigator.vibrate) navigator.vibrate(ms);
  }

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    const target = document.getElementById(id);
    if(target) target.classList.add('active');
  }

  function openModal(id){ 
    const modal = document.getElementById(id);
    if(modal) modal.classList.add('active');
  }
  function closeModal(id){ 
    const modal = document.getElementById(id);
    if(modal) modal.classList.remove('active'); 
  }

  function triggerMenuAnimation() {
    const topbar = document.querySelector('.topbar');
    if(topbar) { topbar.classList.remove('visible'); setTimeout(() => topbar.classList.add('visible'), 50); }
    
    const logo = document.querySelector('.logo-wrap');
    if(logo) { logo.classList.remove('visible'); setTimeout(() => logo.classList.add('visible'), 150); }
    
    const arena = document.querySelector('.fighter-arena');
    if(arena) { arena.classList.remove('visible'); setTimeout(() => arena.classList.add('visible'), 300); }
    
    const startBtn = document.querySelector('.btn-start-wrap');
    if(startBtn) { startBtn.classList.remove('visible'); setTimeout(() => startBtn.classList.add('visible'), 450); }
    
    const secondary = document.querySelector('.menu-secondary');
    if(secondary) { secondary.classList.remove('visible'); setTimeout(() => secondary.classList.add('visible'), 550); }
    
    const items = document.querySelectorAll('.how-item, .how-divider');
    const version = document.querySelector('.version');
    
    items.forEach(item => item.classList.remove('visible'));
    if(version) version.classList.remove('visible');
    
    items.forEach((item, index) => {
      const delay = index * 120;
      setTimeout(() => { item.classList.add('visible'); }, 650 + delay);
    });
    
    setTimeout(() => { if(version) version.classList.add('visible'); }, 650 + items.length * 120 + 200);
  }

  // LOADING SCREEN
  const circumference = 2 * Math.PI * 80;
  let progress = 0;
  let loadingInterval = null;
  
  loadingInterval = setInterval(() => {
    progress += Math.random() * 2 + 1.2;
    if (progress > 100) progress = 100;
    
    const offset = circumference - (progress / 100) * circumference;
    if(progressCircle) progressCircle.style.strokeDashoffset = offset;
    if(progressPercent) progressPercent.textContent = Math.floor(progress) + '%';
    
    if (progress >= 100) {
      clearInterval(loadingInterval);
      loadingInterval = null;
      if(loadingStatus) {
        loadingStatus.textContent = 'READY!';
        loadingStatus.style.color = 'var(--gold-light)';
      }
      
      setTimeout(() => {
        if(loadingScreen) loadingScreen.classList.add('hide');
        setTimeout(() => {
          if(loadingScreen) loadingScreen.style.display = 'none';
          triggerMenuAnimation();
        }, 800);
      }, 500);
    }
  }, 80);

  // Menu button handlers
  const startBtn = document.getElementById('btn-start');
  if(startBtn) startBtn.onclick = function(){ startCountdown(); };
  
  const settingsBtn = document.getElementById('btn-settings');
  if(settingsBtn) settingsBtn.onclick = function(){ openModal('modal-settings'); };
  
  const settingsBtn2 = document.getElementById('btn-settings-2');
  if(settingsBtn2) settingsBtn2.onclick = function(){ openModal('modal-settings'); };
  
  const leaderboardBtn = document.getElementById('btn-leaderboard');
  if(leaderboardBtn) leaderboardBtn.onclick = function(){ renderLeaderboard(); openModal('modal-leaderboard'); };
  
  const settingsClose = document.getElementById('btn-settings-close');
  if(settingsClose) settingsClose.onclick = function(){ closeModal('modal-settings'); };
  
  const leaderboardClose = document.getElementById('btn-leaderboard-close');
  if(leaderboardClose) leaderboardClose.onclick = function(){ closeModal('modal-leaderboard'); };

  let soundOn = true;
  const soundToggle = document.getElementById('btn-sound-toggle');
  if(soundToggle) {
    soundToggle.onclick = function(){
      soundOn = !soundOn;
      soundToggle.textContent = soundOn ? '🔊' : '🔇';
      settings.sound = soundOn ? Number(document.getElementById('set-sound').value) : 0;
    };
  }

  // Settings handlers
  const setSound = document.getElementById('set-sound');
  if(setSound) {
    setSound.oninput = function(){ 
      settings.sound = Number(this.value); 
      const lbl = document.getElementById('lbl-sound');
      if(lbl) lbl.textContent = settings.sound+'%'; 
      soundOn = settings.sound>0; 
      const st = document.getElementById('btn-sound-toggle');
      if(st) st.textContent = soundOn?'🔊':'🔇'; 
    };
  }
  
  const setMusic = document.getElementById('set-music');
  if(setMusic) {
    setMusic.oninput = function(){ 
      settings.music = Number(this.value); 
      const lbl = document.getElementById('lbl-music');
      if(lbl) lbl.textContent = settings.music+'%'; 
    };
  }
  
  const setVibration = document.getElementById('set-vibration');
  if(setVibration) {
    setVibration.onchange = function(){ settings.vibration = this.checked; };
  }
  
  const setTheme = document.getElementById('set-theme');
  if(setTheme) {
    setTheme.onchange = function(){
      settings.theme = this.value;
      if(phone) {
        phone.classList.remove('theme-neon','theme-classic','theme-midnight');
        phone.classList.add('theme-'+settings.theme);
      }
    };
  }
  
  const setDifficulty = document.getElementById('set-difficulty');
  if(setDifficulty) {
    setDifficulty.onchange = function(){ settings.difficulty = this.value; };
  }

  // Leaderboard
  let leaderboardTab = 'global';
  const leaderboards = {
    global: [
      {name:'PlayerOne', score:2500},
      {name:'WarriorX', score:2200},
      {name:'TapMaster', score:1800},
      {name:'SpeedKing', score:1650},
      {name:'You', score:1200, me:true}
    ],
    friends: [
      {name:'WarriorX', score:2200},
      {name:'SpeedKing', score:1650},
      {name:'You', score:1200, me:true}
    ]
  };
  
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.onclick = function(){
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      this.classList.add('active');
      leaderboardTab = this.dataset.tab;
      renderLeaderboard();
    };
  });
  
  function renderLeaderboard(){
    const list = [...leaderboards[leaderboardTab]].sort((a,b)=>b.score-a.score);
    const el = document.getElementById('leaderboard-list');
    if(!el) return;
    el.innerHTML = '';
    const medals = ['🥇','🥈','🥉'];
    list.forEach((p,i)=>{
      const li = document.createElement('li');
      if(p.me) li.classList.add('me');
      li.innerHTML = `<span class="rank">${medals[i] || (i+1)}</span><span class="lb-name">${p.name}</span><span class="lb-score">${p.score}</span>`;
      el.appendChild(li);
    });
  }
  
  function recordResult(myScore){
    ['global','friends'].forEach(k=>{
      const me = leaderboards[k].find(p=>p.me);
      if(me) me.score += myScore;
    });
  }

  // Countdown & Game
  let countdownTimer = null;
  let gameTimer = null;
  
  function startCountdown(){
    showScreen('screen-countdown');
    let n = 3;
    const countdownNum = document.getElementById('countdown-num');
    if(countdownNum) countdownNum.textContent = n;
    beep(440,0.15,'sine');
    if(countdownTimer) clearInterval(countdownTimer);
    countdownTimer = setInterval(()=>{
      n--;
      if(n>0){
        if(countdownNum) countdownNum.textContent = n;
        beep(440,0.15,'sine');
      } else {
        clearInterval(countdownTimer);
        countdownTimer = null;
        if(countdownNum) countdownNum.textContent = 'GO!';
        beep(880,0.25,'sine');
        setTimeout(startGame, 450);
      }
    },700);
  }

  const game = {
    p1:0, p2:0, value:50, timeLeft:30, running:false, paused:false
  };

  function updateBar(){
    const fillBlue = document.getElementById('fill-blue');
    const fillRed = document.getElementById('fill-red');
    const marker = document.getElementById('bar-marker');
    if(fillBlue) fillBlue.style.height = game.value + '%';
    if(fillRed) fillRed.style.height = (100-game.value) + '%';
    if(marker) marker.style.top = (100-game.value) + '%';
  }
  function updateScores(){
    const p1 = document.getElementById('p1-score');
    const p2 = document.getElementById('p2-score');
    if(p1) p1.textContent = game.p1;
    if(p2) p2.textContent = game.p2;
  }
  function formatTime(s){
    const m = Math.floor(s/60), r = s%60;
    return m+':'+String(r).padStart(2,'0');
  }

  function startGame(){
    const cfg = DIFFICULTY[settings.difficulty];
    game.p1 = 0; game.p2 = 0; game.value = 50; game.timeLeft = cfg.duration; 
    game.running = true; game.paused = false;
    updateScores(); updateBar();
    const timerEl = document.getElementById('game-timer');
    if(timerEl) timerEl.textContent = formatTime(game.timeLeft);
    showScreen('screen-game');
    if(gameTimer) clearInterval(gameTimer);
    gameTimer = setInterval(()=>{
      if(game.paused) return;
      game.timeLeft--;
      if(timerEl) timerEl.textContent = formatTime(game.timeLeft);
      if(game.timeLeft<=0){ 
        clearInterval(gameTimer); 
        gameTimer = null; 
        finishGame(); 
      }
    },1000);
  }

  function spawnParticle(zoneEl, x, y, color){
    if(!zoneEl) return;
    const p = document.createElement('div');
    p.className='particle';
    p.style.left = x+'px'; p.style.top = y+'px';
    p.style.background = color;
    p.style.boxShadow = '0 0 10px '+color;
    const ang = Math.random()*Math.PI*2;
    const dist = 30 + Math.random()*30;
    p.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy', Math.sin(ang)*dist+'px');
    zoneEl.appendChild(p);
    setTimeout(()=>p.remove(), 600);
  }

  function tap(team, e){
    if(!game.running || game.paused) return;
    const cfg = DIFFICULTY[settings.difficulty];
    const zone = team==='p1' ? document.getElementById('zone-p1') : document.getElementById('zone-p2');
    if(!zone) return;
    const rect = zone.getBoundingClientRect();
    let x = rect.width/2, y = rect.height/2;
    if(e && e.touches && e.touches[0]){ x = e.touches[0].clientX - rect.left; y = e.touches[0].clientY - rect.top; }
    else if(e && e.clientX){ x = e.clientX - rect.left; y = e.clientY - rect.top; }
    spawnParticle(zone, x, y, team==='p1' ? 'var(--blue-light)' : 'var(--red-light)');
    zone.classList.remove('shake'); void zone.offsetWidth; zone.classList.add('shake');

    if(team==='p1'){ 
      game.p1++; 
      game.value = Math.min(100, game.value + cfg.step); 
      tapSound(true); 
    } else { 
      game.p2++; 
      game.value = Math.max(0, game.value - cfg.step); 
      tapSound(false); 
    }
    vibrate(12);
    updateScores(); updateBar();

    if(game.value>=100){ 
      if(gameTimer) clearInterval(gameTimer); 
      gameTimer = null;
      finishGame('p1'); 
    } else if(game.value<=0){ 
      if(gameTimer) clearInterval(gameTimer); 
      gameTimer = null;
      finishGame('p2'); 
    }
  }

  const zoneP1 = document.getElementById('zone-p1');
  const zoneP2 = document.getElementById('zone-p2');
  if(zoneP1) zoneP1.addEventListener('pointerdown', function(e){ tap('p1', e); });
  if(zoneP2) zoneP2.addEventListener('pointerdown', function(e){ tap('p2', e); });

  document.addEventListener('keydown', function(e) {
    const key = e.key.toLowerCase();
    if (key === 'q') {
      e.preventDefault();
      if (game.running && !game.paused) {
        tap('p1', null);
      }
    } else if (key === 'p') {
      e.preventDefault();
      if (game.running && !game.paused) {
        tap('p2', null);
      }
    }
  });

  function finishGame(forcedWinner){
    game.running = false;
    let winner = forcedWinner;
    if(!winner){
      if(game.value>50) winner='p1';
      else if(game.value<50) winner='p2';
      else winner = game.p1>=game.p2 ? 'p1' : 'p2';
    }
    const isBlue = winner==='p1';
    const winnerTitle = document.getElementById('winner-title');
    if(winnerTitle) {
      winnerTitle.textContent = isBlue ? 'BLUE TEAM WINS!' : 'RED TEAM WINS!';
      winnerTitle.className = 'winner-title ' + (isBlue?'blue':'red');
    }
    const finalScore = document.getElementById('final-score');
    if(finalScore) finalScore.textContent = game.p1 + ' - ' + game.p2;
    recordResult(Math.max(game.p1, game.p2));
    fanfare();
    launchConfetti();
    showScreen('screen-winner');
  }

  function launchConfetti(){
    const host = document.getElementById('screen-winner');
    if(!host) return;
    const colors = ['var(--gold-light)','var(--blue-light)','var(--red-light)','#fff'];
    for(let i=0;i<30;i++){
      const c = document.createElement('div');
      c.className='confetti';
      c.style.left = Math.random()*100+'%';
      c.style.width = (5+Math.random()*6)+'px';
      c.style.height = (8+Math.random()*10)+'px';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (1.4+Math.random()*1.2)+'s';
      c.style.animationDelay = (Math.random()*0.6)+'s';
      host.appendChild(c);
      setTimeout(()=>c.remove(), 3200);
    }
  }

  // Pause handlers
  const pauseBtn = document.getElementById('btn-pause');
  if(pauseBtn) {
    pauseBtn.onclick = function(){
      if(!game.running) return;
      game.paused = true;
      const p1 = document.getElementById('pause-p1');
      const p2 = document.getElementById('pause-p2');
      if(p1) p1.textContent = game.p1;
      if(p2) p2.textContent = game.p2;
      showScreen('screen-pause');
    };
  }
  
  const resumeBtn = document.getElementById('btn-resume');
  if(resumeBtn) {
    resumeBtn.onclick = function(){
      game.paused = false;
      showScreen('screen-game');
    };
  }
  
  const restartBtn = document.getElementById('btn-restart');
  if(restartBtn) {
    restartBtn.onclick = function(){
      if(gameTimer) clearInterval(gameTimer);
      gameTimer = null;
      game.running = false;
      startCountdown();
    };
  }
  
  const pauseMenuBtn = document.getElementById('btn-pause-menu');
  if(pauseMenuBtn) {
    pauseMenuBtn.onclick = function(){
      if(gameTimer) clearInterval(gameTimer);
      gameTimer = null;
      game.running = false;
      showScreen('screen-menu');
    };
  }

  const playAgainBtn = document.getElementById('btn-play-again');
  if(playAgainBtn) playAgainBtn.onclick = function(){ startCountdown(); };
  
  const winnerMenuBtn = document.getElementById('btn-winner-menu');
  if(winnerMenuBtn) winnerMenuBtn.onclick = function(){ showScreen('screen-menu'); };

  // Cleanup function
  window._gameCleanup = function() {
    if(countdownTimer) clearInterval(countdownTimer);
    if(gameTimer) clearInterval(gameTimer);
    if(loadingInterval) clearInterval(loadingInterval);
  };

  renderLeaderboard();

  // Handle page unload
  window.addEventListener('beforeunload', function() {
    if(window._gameCleanup) window._gameCleanup();
    if(window._bgCleanup) window._bgCleanup();
  });
})();
</script>
